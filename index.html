<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>体素拆迁队 · Voxel Demolition</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1.5 14 4.8v6.4L8 14.5 2 11.2V4.8z' fill='%23d9724e'/%3E%3Cpath d='M8 8v6.5L2 11.2V4.8z' fill='%23a5503a'/%3E%3C/svg%3E">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe0ec; color: #1f2328; font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: fixed; inset: 0; pointer-events: none; }
#cross { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border: 2px solid rgba(255,255,255,.85); border-radius: 50%; box-shadow: 0 0 3px rgba(0,0,0,.4); }
#cross i { position: absolute; left: 8px; top: 8px; width: 2px; height: 2px; background: #fff; border-radius: 50%; }
.panel, #obj, #stats { background: rgba(18, 22, 28, .62); color: #f2f2ef; backdrop-filter: blur(6px); border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
#obj { position: absolute; left: 14px; top: 14px; width: 300px; padding: 12px 14px; font-size: 13px; }
#obj .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
#obj .head b { font-size: 16px; } #obj .head span { color: #ffcf7a; }
#obj .bar { height: 6px; background: rgba(255,255,255,.15); border-radius: 3px; overflow: hidden; margin-bottom: 6px; }
#obj .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb347, #ff6a3d); transition: width .3s; }
#obj-money { margin-top: 4px; } #obj-money b { color: #9be28f; } #obj-money b.mid { color: #e8e8e8; } #obj-money b.bad { color: #ff9c7a; }
#obj-medals { margin-top: 6px; display: flex; gap: 10px; font-size: 12px; color: #bbb; }
#obj-medals .g { color: #f5c542; } #obj-medals .s { color: #d2d6dc; }
#stats { position: absolute; right: 14px; top: 14px; padding: 10px 14px; font-size: 12px; color: #ccc; min-width: 150px; pointer-events: auto; }
#stats b { display: inline-block; min-width: 58px; color: #fff; font: 600 14px ui-monospace, Consolas, monospace; margin-right: 6px; text-align: right; }
#stats .btns { display: flex; gap: 6px; margin-top: 8px; }
#stats button { flex: 1; border: 0; border-radius: 8px; padding: 5px 0; background: rgba(255,255,255,.14); color: #fff; font: 12px inherit; cursor: pointer; font-family: inherit; }
#toast { position: absolute; left: 50%; top: 26%; transform: translateX(-50%); background: rgba(18,22,28,.75); color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 15px; opacity: 0; transition: opacity .3s; white-space: nowrap; }
#dock { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); text-align: center; pointer-events: auto; }
#hint { display: inline-block; color: #fff; background: rgba(18,22,28,.6); padding: 5px 14px; border-radius: 14px; font-size: 13px; margin-bottom: 8px; }
#belt { display: flex; gap: 6px; background: rgba(18,22,28,.6); padding: 6px; border-radius: 14px; backdrop-filter: blur(6px); }
.tool { position: relative; width: 74px; height: 64px; border: 1px solid transparent; border-radius: 10px; background: transparent; color: #e8e6e0; cursor: pointer; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 6px; }
.tool svg { width: 26px; height: 26px; margin-bottom: 3px; }
.tool span { font-size: 12px; }
.tool .k { position: absolute; left: 6px; top: 3px; font-style: normal; font-size: 10px; color: #999; }
.tool .c { position: absolute; right: 5px; top: 3px; font-style: normal; font-size: 10px; color: #f5c542; }
.tool.on { background: rgba(255,179,71,.18); border-color: #ffb347; color: #fff; }
#menu, #result { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15,20,28,.45); backdrop-filter: blur(4px); }
#menu[hidden], #result[hidden] { display: none; }
.card { background: rgba(250,248,244,.97); border-radius: 18px; padding: 24px 28px; max-width: 760px; width: calc(100% - 28px); max-height: 94vh; overflow: auto; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.card h1 { margin: 0 0 4px; font-size: 28px; } .card h1 small { font-size: 14px; color: #888; font-weight: 400; }
.lead { color: #444; line-height: 1.6; margin: 6px 0 14px; }
#scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.scene { text-align: left; border: 1px solid #e3ddd2; background: #fff; border-radius: 12px; padding: 10px 12px; cursor: pointer; font-family: inherit; color: inherit; }
.scene:hover, .scene.cur { border-color: #ff8a4c; box-shadow: 0 0 0 2px rgba(255,138,76,.2); }
.scene b { font-size: 15px; } .scene .st { float: right; color: #f0b429; letter-spacing: 1px; }
.scene p { margin: 6px 0; font-size: 12.5px; color: #555; line-height: 1.5; } .scene small { color: #a0522d; }
.primary { background: linear-gradient(135deg, #ff8a4c, #e5533d); color: #fff; border: 0; border-radius: 10px; padding: 10px 26px; font-size: 16px; cursor: pointer; font-family: inherit; }
.primary:disabled { opacity: .6; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin-top: 16px; font-size: 13px; align-items: center; color: #333; }
kbd { display: inline-block; min-width: 20px; padding: 0 5px; margin-right: 2px; border-radius: 5px; background: #eceae4; border: 1px solid #d6d2c8; border-bottom-width: 2px; font: 11px ui-monospace, monospace; text-align: center; }
#result .card { max-width: 420px; text-align: center; }
#res-stars { font-size: 46px; color: #ddd; letter-spacing: 6px; } #res-stars .on { color: #f5b324; text-shadow: 0 2px 6px rgba(200,140,0,.4); }
#res-medal { font-weight: 700; color: #a0522d; margin: 4px 0 10px; }
#res-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; text-align: left; margin: 0 auto 16px; max-width: 260px; }
#res-stats dt { color: #777; } #res-stats dd { margin: 0; font-weight: 600; text-align: right; }
#result footer { display: flex; gap: 8px; justify-content: center; } #result footer button:not(.primary) { border: 1px solid #ddd; background: #fff; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-family: inherit; }
#err { display: none; position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); z-index: 99; max-width: 640px; width: calc(100% - 32px); background: #fff1f1; color: #8a1c1c; border: 1px solid #f3b4b4; border-radius: 14px; padding: 12px 16px; font-size: 14px; line-height: 1.6; }
#touch { display: none; } body.touch #touch { display: block; }
#stick { position: fixed; left: 24px; bottom: 120px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.5); }
#stick i { position: absolute; left: 40px; top: 40px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.8); }
#tbtns { position: fixed; right: 16px; bottom: 120px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#tbtns button { width: 66px; height: 66px; border-radius: 50%; border: 0; background: rgba(255,255,255,.75); font-family: inherit; font-size: 14px; }
body.touch #obj { width: 220px; font-size: 11px; } body.touch .tool { width: 52px; height: 52px; } body.touch .tool span { display: none; } body.touch #scenes { grid-template-columns: 1fr; }
</style>

</script>

<body>
<canvas id="view"></canvas>
<div id="hud">
  <div id="cross"><i></i></div>
  <div id="obj">
    <div class="head"><b id="obj-title"></b><span id="obj-goal"></span></div>
    <div class="bar"><i id="obj-bar"></i></div>
    <div id="obj-progress"></div>
    <div id="obj-money"></div>
    <div id="obj-medals"></div>
  </div>
  <div id="stats">
    <div><b id="st-vox">0</b>体素被摧毁</div>
    <div><b id="st-deb">0</b>产生碎块</div>
    <div><b id="st-act">0</b>正在下落</div>
    <div><b id="st-fps">0</b>FPS</div>
    <div class="btns"><button id="btn-reset">重置 R</button><button id="btn-menu">选关 Esc</button></div>
  </div>
  <div id="toast"></div>
  <div id="dock"><div id="hint"></div><div id="belt"></div></div>
</div>
<div id="touch">
  <div id="stick"><i></i></div>
  <div id="tbtns"><button data-t="fire">使用</button><button data-t="alt">引爆/扔</button><button data-t="jump">跳</button><button data-t="fly">飞</button></div>
</div>

<div id="menu"><div class="card">
  <h1>体素拆迁队 <small>Voxel Demolition</small></h1>
  <p class="lead">每座建筑都由几十万个 10 厘米的小体素搭成，全部可以拆：打断支撑，上面的部分会整块脱落、翻滚、砸碎在地上。用最少的钱完成目标，拿金牌。</p>
  <div id="scenes"></div>
  <button id="play" class="primary" disabled>加载中…</button>
  <div class="keys">
    <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>移动（<kbd>Shift</kbd> 跑，<kbd>空格</kbd> 跳，<kbd>F</kbd> 飞行）</span>
    <span><kbd>鼠标</kbd></span><span>转视角（没锁定鼠标时：按住拖动）</span>
    <span><kbd>左键</kbd></span><span>使用工具</span>
    <span><kbd>右键</kbd> / <kbd>E</kbd></span><span>引爆炸药 / 扔出抓着的碎块</span>
    <span><kbd>1</kbd>–<kbd>6</kbd> <kbd>Q</kbd> <kbd>滚轮</kbd></span><span>切换工具</span>
    <span><kbd>T</kbd> <kbd>R</kbd> <kbd>Esc</kbd></span><span>慢动作 / 重置关卡 / 菜单</span>
  </div>
</div></div>

<div id="result" hidden><div class="card">
  <h2 id="res-title"></h2>
  <div id="res-stars"></div>
  <p id="res-medal"></p>
  <dl id="res-stats"></dl>
  <footer><button id="res-retry">再来一次</button><button id="res-next" class="primary">下一关</button><button id="res-free">继续拆</button></footer>
</div></div>
